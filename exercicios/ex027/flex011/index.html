<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        div.conteiner{
            background-color: aquamarine;
            display: flex;
            flex-flow: row nowrap;
            margin-bottom: 200px;
            
        }
        div.item {
            background-color: blanchedalmond;
            border: 1px solid black;
            flex-basis: 200px;
            text-align: center;
            padding-bottom: 20px;
            
            
        }

        div#cxA {
            flex-shrink: 0;
            flex-grow: 1;
        }

        div#cxB {
            flex-shrink: 1;
            flex-grow: 4;
        }

        div#cxC {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div.conteiner1{
            background-color: aquamarine;
            display: flex;
            flex-flow: row nowrap;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
        
    </div>

    <div class="conteiner1">
        <div class="item" id="cxA2">A</div>
        <div class="item" id="cxB2">B</div>
        <div class="item" id="cxC2">C</div>
        
    </div>
</body>
</html>
